<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Post - King | Tự động đăng bài đa nền tảng</title>
  <meta name="description" content="Super Post - King, ứng dụng tự động đăng Facebook, TikTok, YouTube, Threads, Instagram, X và Zalo Video">
  <link rel="icon" type="image/png" href="/assets/branding/super-post-king-logo.png">

  <!-- Theme init (before CSS to avoid flash); default = light -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('covergem-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Inter (full Vietnamese support via unicode-range) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap&subset=vietnamese,latin-ext" rel="stylesheet">

  <!-- AG Grid Community -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.3/styles/ag-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.3/styles/ag-theme-alpine.css">
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.3/dist/ag-grid-community.min.noStyle.js"></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="/css/style.css?v=20261005pficon1">
  <link rel="stylesheet" href="/css/robot-guide.css?v=20260914font1">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" data-tour-id="app-brand">
        <span class="brand-icon" aria-hidden="true">
          <img src="/assets/branding/super-post-king-logo.png" alt="">
        </span>
        <span class="brand-text">Super Post</span>
      </div>

      <nav class="sidebar-nav" data-tour-id="main-navigation">
        <a href="#" class="nav-item active" data-page="dashboard" id="nav-dashboard">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="browsers" id="nav-browsers">
          <span class="nav-icon">◉</span>
          <span class="nav-label">Trình duyệt</span>
        </a>
        <a href="#" class="nav-item" data-page="data" data-platform="facebook" id="nav-facebook">
          <span class="nav-icon platform-icon platform-icon-facebook" aria-hidden="true">
            <img src="/assets/platforms/facebook.webp" alt="">
          </span>
          <span class="nav-label">Đăng bài Facebook</span>
        </a>
        <a href="#" class="nav-item" data-page="data" data-platform="tiktok" id="nav-tiktok">
          <span class="nav-icon platform-icon platform-icon-tiktok" aria-hidden="true">
            <img src="/assets/platforms/tiktok.png" alt="">
          </span>
          <span class="nav-label">Đăng bài TikTok</span>
        </a>
        <a href="#" class="nav-item" data-page="data" data-platform="youtube" id="nav-youtube">
          <span class="nav-icon platform-icon platform-icon-youtube" aria-hidden="true">
            <img src="/assets/platforms/youtube.webp" alt="">
          </span>
          <span class="nav-label">Đăng bài YouTube</span>
        </a>
        <a href="#" class="nav-item" data-page="data" data-platform="threads" id="nav-threads">
          <span class="nav-icon platform-icon platform-icon-threads" aria-hidden="true">
            <img src="/assets/platforms/threads.png" alt="">
          </span>
          <span class="nav-label">Đăng bài Threads</span>
        </a>
        <a href="#" class="nav-item" data-page="data" data-platform="instagram" id="nav-instagram">
          <span class="nav-icon platform-icon platform-icon-instagram" aria-hidden="true">
            <img src="/assets/platforms/instagram.png" alt="">
          </span>
          <span class="nav-label">Đăng bài Instagram</span>
        </a>
        <a href="#" class="nav-item" data-page="data" data-platform="x" id="nav-x">
          <span class="nav-icon platform-icon platform-icon-x" aria-hidden="true">
            <img src="/assets/platforms/x.png" alt="">
          </span>
          <span class="nav-label">Đăng bài X</span>
        </a>
        <a href="#" class="nav-item" data-page="data" data-platform="zalovideo" id="nav-zalovideo">
          <span class="nav-icon platform-icon platform-icon-zalovideo" aria-hidden="true">
            <img src="/assets/platforms/zalo-video.svg" alt="">
          </span>
          <span class="nav-label">Đăng Zalo Video</span>
        </a>
        <a href="#" class="nav-item" data-page="scheduler" id="nav-scheduler">
          <span class="nav-icon">⏱</span>
          <span class="nav-label">Hẹn giờ</span>
        </a>
        <a href="#" class="nav-item" data-page="runner" id="nav-runner">
          <span class="nav-icon">≡</span>
          <span class="nav-label">Log chạy</span>
        </a>
        <a href="#" class="nav-item" data-page="settings" id="nav-settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Cài đặt</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="brand-author">
          <span class="brand-author-label">Tác giả</span>
          <a href="https://www.kingautomationai.com" target="_blank" rel="noopener noreferrer">King Automation AI</a>
          <a class="more-tools-link" href="https://www.kingautomationai.com" target="_blank" rel="noopener noreferrer">
            Xem thêm các Tool khác <span aria-hidden="true">↗</span>
          </a>
        </div>
        <div class="theme-toggle" id="theme-toggle">
          <button type="button" data-theme-val="light" onclick="App.setTheme('light')">☀️ Sáng</button>
          <button type="button" data-theme-val="dark" onclick="App.setTheme('dark')">🌙 Tối</button>
        </div>
        <div class="sidebar-license-status" id="sidebar-license-status" aria-live="polite">
          <span class="status-dot"></span>
          <span class="sidebar-license-copy">
            <small>Thông tin license</small>
            <strong>Đang kiểm tra...</strong>
          </span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Page Header -->
      <header class="page-header" id="page-header">
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <button class="app-update-notice" id="app-update-notice" type="button"
                onclick="Updater.showDetails()" aria-label="Xem bản cập nhật Super Post King" hidden>
          <span class="app-update-dot" aria-hidden="true"></span>
          <span>Có bản mới</span>
          <strong id="app-update-version"></strong>
        </button>
        <div class="page-actions" id="page-actions"></div>
      </header>
      <div class="workspace-tabs" id="workspace-tabs" style="display:none;">
        <button class="workspace-tab" data-page="data" data-tour-id="workspace-data"
                onclick="App.navigateTo('data')">Dữ liệu</button>
        <button class="workspace-tab" data-page="postcfg" data-tour-id="workspace-config"
                onclick="App.navigateTo('postcfg')">Cấu hình</button>
      </div>

      <!-- Page Container -->
      <div class="page-container" id="page-container">
        <div id="page-dashboard" class="page active"></div>
        <div id="page-data" class="page"></div>
        <div id="page-browsers" class="page"></div>
        <div id="page-runner" class="page"></div>
        <div id="page-scheduler" class="page"></div>
        <div id="page-postcfg" class="page"></div>
        <div id="page-settings" class="page"></div>
      </div>
    </main>

  <a class="account-zalo-fab"

    <span class="account-telegram-ping" aria-hidden="true"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.3 4.7 3.4 6.2-.2 1-.6 2.1-1.2 3-.3.4.1.9.5.7 1.7-.5 3-1.1 3.9-1.7 1.1.3 2.2.5 3.4.5 5.5 0 10-3.6 10-8s-4.5-8-10-8Z"/><path d="M8.4 8.9h5.3c.4 0 .6.5.4.8L9.8 14h4.1v1.3H8.3c-.4 0-.6-.5-.4-.8l4.3-4.3H8.4V8.9Z" fill="#168bd2"/></svg>
  </a>

  <a class="account-telegram-fab"
     href="https://t.me/kingtoolai" target="_blank" rel="noopener noreferrer"
     title="Chat hỗ trợ qua Telegram"
     aria-label="Mở chat hỗ trợ Telegram King Tool AI">
    <span class="account-telegram-ping" aria-hidden="true"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 4-3.1 15.2c-.2 1.1-.9 1.4-1.8.9l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.7-7.9c.4-.3-.1-.5-.6-.2L5.8 13.2 1.2 11.8c-1-.3-1-1 .2-1.5L19.3 3.4c.8-.3 1.6.2 1.7.6Z"/></svg>

  <button class="global-guide-fab" type="button"
          onclick="RobotGuide.open()"
          title="Mở hướng dẫn sử dụng"
          aria-label="Mở Robot hướng dẫn sử dụng">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5zm16 0A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/>
    </svg>
    <span>Hướng dẫn sử dụng</span>
  </button>

  <div class="toast-container" id="toast-container"></div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title"></h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>
